[package]
name = "xtask"
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "=3.27.0"
